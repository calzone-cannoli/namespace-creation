---
- name: Create namespaces
  hosts: localhost
  gather_facts: false
  vars_files: structure.yml
  vars: #Collected from Survey
    tenant_env:
      - env: Dev
        size: Extra Small
        name: aaa-test-dev
      - env: Dev1
        size: Small
        name: aaa-test-dev1
      - env: QA
        size: Medium
        name: aaa-test-qa
      # - env: Stage
      #   size: Large
      #   name: aaa-test-stage
      # - env: Prod
      #   size: Extra Large
      #   name: aaa-test-prod
    business_unit: Diagnostics
    tenant_id: "aaa-test"
    nonprod_shirt_size: "Small"
    prod_shirt_size: "Medium"
  pre_tasks:
    - name: Import the custom task file
      ansible.builtin.include_tasks: get_instance.yml
      loop: "{{ tenant_env }}"
    # - name: Print credential
    #   ansible.builtin.debug:
    #     msg: 
    #       - "{{ business_unit | lower }}"
    #       - "{{ diagnostics_nonprod }}"
    #       - "{{ diagnostics_prod }}"
  roles:
    - create_namespace
